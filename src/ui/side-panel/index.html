<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../logo.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Flow Automation - Auto Flow on Google Flow</title>
    <link rel="modulepreload" crossorigin href="../../../assets/utils-BCNko0UU.js">
    <link rel="modulepreload" crossorigin href="../../../assets/remoteConfig-BX4Oz3mk.js">
    <link rel="stylesheet" crossorigin href="../../../assets/index-DR4wMqUa.css">
    <link rel="stylesheet" href="./spec-pipeline.css">
    <script type="module" crossorigin src="../../../assets/index.html-YcmfxOFZ.js"></script>
  </head>
  <body>
    <header class="app-top-header">
      <div class="header-branding">
        <div class="app-icon-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <path d="M9 3v18"/>
            <path d="M3 9h18"/>
            <path d="M3 15h18"/>
          </svg>
        </div>
        <span class="app-title">Flow Studio</span>
        <span class="version-badge">ext v2.4</span>
      </div>

      <div id="panel-tab-bar" class="panel-tab-bar">
        <button id="tab-btn-spec" class="panel-tab-btn active">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Spec Pipeline</span>
          <span class="tab-active-dot"></span>
        </button>
        <button id="tab-btn-classic" class="panel-tab-btn">
          <span>⚡</span> Classic Batch
        </button>
      </div>

      <div class="header-right">
        <div class="bridge-status-pill">
          <span class="bridge-status-dot"></span>
          <span>Flow Bridge Active</span>
        </div>
      </div>
    </header>

    <div id="spec-container" class="panel-view active" style="display: block;">
      <nav class="spec-workspace-tabs" aria-label="Spec Pipeline views">
        <button type="button" class="spec-workspace-tab active" data-spec-view="frames" aria-pressed="true">Frames</button>
        <button type="button" class="spec-workspace-tab" data-spec-view="settings" aria-pressed="false">⚙ Settings</button>
        <button type="button" class="spec-workspace-tab" data-spec-view="logs" aria-pressed="false">Logs <span id="spec-log-count">0</span></button>
      </nav>
      <div id="spec-pipeline-app"></div>
      <section id="spec-settings-view" class="spec-tools-view" hidden></section>
      <section id="spec-logs-view" class="spec-tools-view" hidden></section>
    </div>
    <div id="classic-container" class="panel-view" style="display: none;">
      <div id="app"></div>
    </div>
    <script src="./flow-destination.js"></script>
    <script src="./pipeline-concurrency.js"></script>
    <script src="./reference-preview.js"></script>
    <script src="./reference-editor.js"></script>
    <script src="./frame-recovery.js"></script>
    <script src="./spec-tools.js"></script>
    <!-- Optional reviewer module; all of its UI and defaults live in this folder. -->
    <script type="module" src="../../modules/ai-reviewer/panel.js"></script>
    <script type="module" src="./spec-pipeline.js"></script>
  </body>
</html>
